name: Deploy to GitHub Pages

# Deploys the default branch, whatever it is named (GitHub Pages only accepts deployments from
# it); pushes to other branches skip the jobs.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push supersedes a queued one, never a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - id: pages
        uses: actions/configure-pages@v6

      - name: Build
        # Project sites are served from /<repo>/; configure-pages reports the exact path.
        run: pnpm turbo run build --filter=@shakespeer/web
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - name: Serve the app for every path
        # Pages has no rewrites: unknown paths (deep links such as /plays/hamlet/folger) get
        # 404.html, so it must be the app too. React Router then renders the right page.
        run: cp apps/web/dist/index.html apps/web/dist/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
